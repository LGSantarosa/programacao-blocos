; Firmware de bancada, temporário: mede em que PWM as rodas saem do lugar.
; Não é o robô — é a régua. Grave, meça, e volte com o firmware de verdade:
;
;   pio run -d firmware/calibrar -t upload      # a régua
;   pio run -d firmware -t upload               # o robô de volta
;
; Reusa o hal_esp32.cpp do firmware de verdade de propósito: a frequência do
; PWM e o jeito de escrever nos pinos são parte do que se está medindo, e uma
; cópia divergiria justamente no que importa.
[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -I${PROJECT_DIR}/../../core
build_src_filter = +<*> +<../../src/hal_esp32.cpp>
