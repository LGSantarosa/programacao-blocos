<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robô de Blocos</title>
<style>
  /* Linguagem física: nada aqui é plano. Botão é plástico grosso com sombra
     sólida embaixo, e afunda quando apertado. É a gramática que uma criança de
     quatro anos entende sem ninguém explicar. */
  * { box-sizing: border-box; }

  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Varela Round", Nunito, Quicksand, system-ui, sans-serif; color: #1b3a57; background: #eef5fb;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center;
    padding: 14px 20px; background: #ffffff;
    border-bottom: 3px solid #cfe0ee;
  }
  /* Margem em vez de gap: flex gap só chegou no iOS 14.5, e este projeto
     precisa abrir num iPad 2. */
  header > * { margin-right: 14px; }
  header > *:last-child { margin-right: 0; }

  h1 {
    font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -.02em;
    display: flex; align-items: center;
  }
  h1 .bolinha { margin-right: 10px; }
  h1 .bolinha {
    width: 26px; height: 26px; border-radius: 50%;
    background: #37c26b; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15);
    position: relative;
  }
  /* dois olhinhos no logo — o mesmo bicho que anda na arena */
  h1 .bolinha::before, h1 .bolinha::after {
    content: ''; position: absolute; top: 8px; width: 5px; height: 5px;
    border-radius: 50%; background: #fff;
  }
  h1 .bolinha::before { left: 6px; }
  h1 .bolinha::after  { right: 6px; }

  .espaco { flex: 1; }

  /* ---------- botões físicos ---------- */

  button {
    font-family: inherit; font-size: 19px; font-weight: 800;
    padding: 13px 26px; border: none; border-radius: 16px;
    color: #fff; cursor: pointer; letter-spacing: .01em;
    transition: transform .06s, box-shadow .06s, background .15s;
  }
  button:active:not(:disabled) { transform: translateY(4px); }
  button:focus-visible { outline: 4px solid #1b3a57; outline-offset: 3px; }

  #play   { background: #37c26b;    box-shadow: 0 5px 0 #2a9c54; }
  #parar  { background: #f25c4a; box-shadow: 0 5px 0 #c94435; }
  #mudo   { background: #8fa9bd;    box-shadow: 0 5px 0 #718da3;
            font-size: 20px; padding: 13px 18px; line-height: 1; }
  #play:active:not(:disabled),
  #parar:active:not(:disabled),
  #mudo:active:not(:disabled) { box-shadow: 0 1px 0 rgba(0,0,0,.2); }

  button:disabled {
    background: #d6e3ee; color: #9db4c7; box-shadow: 0 5px 0 #c2d3e1;
    cursor: default;
  }
  #mudo.silenciado { background: #c2d3e1; box-shadow: 0 5px 0 #a8bccd; color: #6c8aa5; }

  /* ---------- seletor de nível ---------- */
  /* Três botões, não um menu suspenso: criança de quatro anos não abre dropdown. */

  #niveis {
    display: flex; background: #dfeaf4; padding: 5px;
    border-radius: 18px; box-shadow: inset 0 2px 4px rgba(27,58,87,.12);
  }
  #niveis button {
    font-size: 15px; font-weight: 800; padding: 9px 15px;
    background: transparent; color: #6c8aa5;
    border-radius: 13px; box-shadow: none;
  }
  #niveis button:active:not(:disabled) { transform: none; }
  #niveis button[aria-pressed="true"] {
    background: #ffffff; color: #1b3a57;
    box-shadow: 0 2px 5px rgba(27,58,87,.18);
  }

  #estado {
    font-size: 15px; font-weight: 700; color: #6c8aa5;
    min-width: 130px; text-align: right;
  }
  #erro { color: #f25c4a; font-size: 15px; font-weight: 700; max-width: 340px; }

  /* ---------- corpo ---------- */

  main { flex: 1; display: flex; min-height: 0; padding: 16px; }
  #editor { margin-right: 16px; }

  /* min-height explícito: em coluna, um flex item pode encolher a zero, e o
     Blockly some junto sem reclamar. */
  #editor {
    flex: 1; min-width: 0; min-height: 320px; background: #ffffff;
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 4px 0 #cfe0ee;
  }

  #painel {
    width: 420px; padding: 18px; background: #ffffff;
    border-radius: 22px; box-shadow: 0 4px 0 #cfe0ee;
    display: flex; flex-direction: column;
  }
  #painel > * { margin-bottom: 14px; }
  #painel > *:last-child { margin-bottom: 0; }

  /* Sem aspect-ratio (iOS 15+): o canvas é 400x400, então altura fixa dá o
     mesmo quadrado e funciona em qualquer navegador. */
  #arena {
    width: 100%; max-width: 384px; height: 384px; border-radius: 18px;
    background: #e4eef7; border: 3px solid #cfe0ee; display: block;
  }

  #leitura {
    font-size: 17px; font-weight: 800; color: #1b3a57;
    background: #eef5fb; border-radius: 14px; padding: 12px 16px;
    text-align: center;
  }

  /* ---------- destaque do bloco ---------- */
  /* O halo do Blockly é discreto demais para uma tela de criança, e não expõe
     classe para estilizar. Marcamos o bloco por conta própria. */

  .blocklyDraggable.aceso > .blocklyPath {
    stroke: #ffc53d !important;
    stroke-width: 5px !important;
    animation: pulsar .7s ease-in-out infinite;
  }
  @keyframes pulsar {
    0%, 100% { stroke-opacity: 1; }
    50%      { stroke-opacity: .3; }
  }

  /* A fonte dos blocos NÃO se mexe por aqui: o Blockly mede o texto para
     dimensionar o bloco antes de o CSS valer, e trocar a família depois estoura
     a borda. Vai pelo tema, em app.js, que ele considera na medição. */
  /* Caixa de blocos e fundo do editor no mesmo tom do resto. */
  .blocklyToolboxDiv { background: #f5fafd !important; padding-top: 8px !important; }
  .blocklyTreeLabel  { font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Varela Round", Nunito, Quicksand, system-ui, sans-serif !important; font-weight: 800 !important;
                       font-size: 15px !important; }
  .blocklyFlyoutBackground { fill: #f5fafd !important; }

  #confete { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
             pointer-events: none; z-index: 50; }

  @media (prefers-reduced-motion: reduce) {
    .blocklyDraggable.aceso > .blocklyPath { animation: none; }
    button { transition: none; }
  }

  /* Tela estreita: o painel do robô vai para baixo do editor. */
  @media (max-width: 900px) {
    main { flex-direction: column; }
    #editor { margin-right: 0; margin-bottom: 16px; }
    #painel { width: auto; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <header>
    <h1><span class="bolinha"></span>Robô de Blocos</h1>
    <span id="erro"></span>
    <span class="espaco"></span>
    <div id="niveis" role="group" aria-label="nível">
      <button type="button" data-nivel="pequeno" aria-pressed="false">Pequeno</button>
      <button type="button" data-nivel="medio"   aria-pressed="true">Médio</button>
      <button type="button" data-nivel="grande"  aria-pressed="false">Grande</button>
    </div>
    <button id="mudo" title="ligar e desligar o som">🔊</button>
    <button id="play">▶ PLAY</button>
    <button id="parar" disabled>■ PARAR</button>
    <span id="estado">conectando…</span>
  </header>
  <main>
    <div id="editor"></div>
    <aside id="painel">
      <canvas id="arena" width="400" height="400"></canvas>
      <div id="leitura">distância: —</div>
    </aside>
  </main>
  <canvas id="confete"></canvas>

  <script>
  /* Escrito em ES5 de propósito, e antes de tudo: se um navegador velho não
     entender os arquivos abaixo, este handler ainda roda e conta o que houve.
     Sem ele a página fica em "conectando..." para sempre, sem dizer por quê —
     que foi exatamente o que aconteceu num iPad 2. */
  window.onerror = function (msg, arq, lin) {
    var caixa = document.getElementById('erro');
    if (!caixa) return false;
    caixa.textContent = 'Esta página não funcionou neste navegador. ' +
      'Ele pode ser antigo demais. (' + msg + ')';
    var estado = document.getElementById('estado');
    if (estado) estado.textContent = 'não abriu';
    return false;
  };
  </script>
  <script src="vendor/blockly_compressed.js"></script>
  <script src="vendor/pt-br.js"></script>
  <script src="compilador.js"></script>
  <script src="campos.js"></script>
  <script src="som.js"></script>
  <script src="niveis.js"></script>
  <script src="robo.js"></script>
  <script src="blocos.js"></script>
  <script src="rede.js"></script>
  <script src="arena.js"></script>
  <script src="app.js"></script>
</body>
</html>
