[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; core/ vira uma biblioteca: #include "vm.h" funciona e o vm.c é compilado
lib_extra_dirs = ${PROJECT_DIR}/..

; ...mas a própria pasta firmware/ também está lá dentro, e tem um src/ — que é
; exatamente o desenho que o PlatformIO reconhece como biblioteca. Sem isto ele
; adota o projeto como sua própria dependência e compila o main.cpp fora do
; contexto onde o AsyncTCP.h existe. Descoberto ao acrescentar o quadros.h: o
; primeiro cabeçalho local do projeto foi o que fez a busca chegar até aqui.
lib_ignore = firmware

lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.1.0

build_flags = -Wall
