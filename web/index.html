<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robô de Blocos</title>
<style>
  /* Linguagem física: nada aqui é plano. Botão é plástico grosso com sombra
     sólida embaixo, e afunda quando apertado — a gramática que uma criança de
     quatro anos entende sem ninguém explicar.

     Sem var(), gap, aspect-ratio ou inset: precisa abrir num iPad 2 com iOS 9. */

  * { box-sizing: border-box; }

  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    /* Fundo quente, não branco clínico: é o que separa brinquedo de formulário. */
    background: #f7f0e4; color: #1b3a57;
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN",
                 "Varela Round", Nunito, Quicksand, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- cabeçalho ---------- */
  /* Faixa colorida em vez de branca. Branco sobre branco é o que dava cara de
     hospital, e uma barra forte também ancora a tela. */

  header {
    display: flex; align-items: center; flex-wrap: nowrap;
    padding: 10px 14px; background: #1b3a57; color: #fff;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
  }
  header > * { margin-right: 10px; }
  header > *:last-child { margin-right: 0; }

  h1 {
    font-size: 19px; font-weight: 800; margin: 0; color: #fff;
    letter-spacing: -.01em; white-space: nowrap;
    display: flex; align-items: center;
  }
  h1 .bolinha {
    width: 22px; height: 22px; border-radius: 50%; margin-right: 8px;
    background: #37c26b; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
    position: relative; flex: none;
  }
  h1 .bolinha::before, h1 .bolinha::after {
    content: ''; position: absolute; top: 7px; width: 4px; height: 4px;
    border-radius: 50%; background: #fff;
  }
  h1 .bolinha::before { left: 5px; }
  h1 .bolinha::after  { right: 5px; }

  .espaco { flex: 1; }

  /* ---------- botões físicos ---------- */

  button {
    font-family: inherit; font-size: 17px; font-weight: 800;
    padding: 11px 20px; border: none; border-radius: 14px;
    color: #fff; cursor: pointer; white-space: nowrap;
    -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
  }
  button:active:not(:disabled) { -webkit-transform: translateY(4px); transform: translateY(4px); }
  button:focus { outline: none; }
  button:focus-visible { outline: 3px solid #ffc53d; outline-offset: 2px; }

  #play  { background: #37c26b; box-shadow: 0 5px 0 #2a9c54; }
  #parar { background: #f25c4a; box-shadow: 0 5px 0 #c94435; }
  #mudo  { background: #4a6f8f; box-shadow: 0 5px 0 #35536b;
           font-size: 18px; padding: 11px 14px; line-height: 1; }
  #play:active:not(:disabled), #parar:active:not(:disabled),
  #mudo:active:not(:disabled) { box-shadow: 0 1px 0 rgba(0,0,0,.25); }

  button:disabled { background: #4a6f8f; color: #90a9be;
                    box-shadow: 0 5px 0 #35536b; cursor: default; opacity: .6; }
  #mudo.silenciado { opacity: .55; }

  /* ---------- seletor de nível ---------- */
  /* Três teclas, não um menu suspenso: criança de quatro anos não abre dropdown. */

  #niveis { display: flex; background: rgba(0,0,0,.22); padding: 4px;
            border-radius: 15px; }
  #niveis button {
    font-size: 14px; font-weight: 800; padding: 8px 13px;
    background: transparent; color: #a9c3d8; border-radius: 11px;
    box-shadow: none;
  }
  #niveis button:active:not(:disabled) { -webkit-transform: none; transform: none; }
  #niveis button[aria-pressed="true"] { background: #fff; color: #1b3a57; }

  #estado { font-size: 14px; font-weight: 700; color: #a9c3d8; white-space: nowrap; }
  #versao { font-size: 11px; color: #6d8ba6; font-family: monospace; }
  #erro { color: #ffd0c9; font-size: 14px; font-weight: 700; max-width: 260px; }

  /* ---------- corpo ---------- */

  main { flex: 1; display: flex; min-height: 0; padding: 12px; }

  #editor {
    flex: 1; min-width: 0; min-height: 260px; background: #fff;
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 4px 0 #e2d5c0;
    margin-right: 12px;
  }

  #painel {
    width: 300px; flex: none; padding: 12px; background: #fff;
    border-radius: 20px; box-shadow: 0 4px 0 #e2d5c0;
    /* Centrado: o painel é mais alto que o conteúdo, e sobra embaixo parece
       descuido enquanto respiro em volta parece escolha. */
    display: flex; flex-direction: column; justify-content: center;
    align-items: center;
  }
  #painel > * { margin-bottom: 10px; }
  #painel > *:last-child { margin-bottom: 0; }

  /* Sem aspect-ratio (iOS 15+): o canvas é 400x400, então altura fixa dá o
     mesmo quadrado em qualquer navegador. */
  #arena {
    width: 100%; max-width: 276px; height: 276px; border-radius: 16px;
    /* Tapete de brincar, não papel de exame. */
    background: #f3e9d7; border: 3px solid #e2d5c0; display: block;
  }

  #leitura {
    width: 100%;
    font-size: 16px; font-weight: 800; color: #1b3a57;
    background: #f7f0e4; border-radius: 12px; padding: 10px 12px;
    text-align: center;
  }

  /* ---------- destaque do bloco ---------- */
  /* O halo do Blockly é discreto demais para uma tela de criança, e não expõe
     classe para estilizar. Marcamos o bloco por conta própria. */

  .blocklyDraggable.aceso > .blocklyPath {
    stroke: #ffc53d !important;
    stroke-width: 5px !important;
    -webkit-animation: pulsar .7s ease-in-out infinite;
    animation: pulsar .7s ease-in-out infinite;
  }
  @-webkit-keyframes pulsar { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .3; } }
  @keyframes pulsar { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .3; } }

  /* A fonte dos blocos NÃO se mexe por aqui: o Blockly mede o texto para
     dimensionar o bloco antes de o CSS valer. Vai pelo tema, em app.js. */
  .blocklyToolboxDiv { background: #fbf6ec !important; padding-top: 6px !important; }
  .blocklyTreeLabel { font-family: inherit !important; font-weight: 800 !important;
                      font-size: 14px !important; }
  .blocklyFlyoutBackground { fill: #fbf6ec !important; }

  #confete { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
             pointer-events: none; z-index: 50; }

  @media (prefers-reduced-motion: reduce) {
    .blocklyDraggable.aceso > .blocklyPath { -webkit-animation: none; animation: none; }
  }

  /* Tablet: a caixa de blocos e a paleta do Blockly já comem largura, então o
     painel do robô encolhe para o editor não virar uma faixa estreita. */
  @media (max-width: 1100px) {
    h1 { font-size: 17px; }
    button { font-size: 15px; padding: 10px 15px; }
    #niveis button { font-size: 13px; padding: 7px 10px; }
    #painel { width: 230px; }
    #arena { max-width: 206px; height: 206px; }
    #versao { display: none; }
  }

  /* Tela estreita de verdade: o painel vai para baixo. */
  @media (max-width: 780px) {
    main { flex-direction: column; }
    #editor { margin-right: 0; margin-bottom: 12px; }
    #painel { width: auto; flex-direction: row; align-items: center; }
    #painel > * { margin-bottom: 0; margin-right: 10px; }
    #arena { max-width: 160px; height: 160px; }
    #leitura { flex: 1; }
  }
</style>
</head>
<body>
  <header>
    <h1><span class="bolinha"></span>Robô de Blocos</h1>
    <span id="erro"></span>
    <span class="espaco"></span>
    <div id="niveis" role="group" aria-label="nível">
      <button type="button" data-nivel="pequeno" aria-pressed="false">Pequeno</button>
      <button type="button" data-nivel="medio"   aria-pressed="true">Médio</button>
      <button type="button" data-nivel="grande"  aria-pressed="false">Grande</button>
    </div>
    <button id="mudo" title="ligar e desligar o som">🔊</button>
    <button id="play">▶ PLAY</button>
    <button id="parar" disabled>■ PARAR</button>
    <span id="estado">conectando…</span>
    <span id="versao" title="versão servida — se não mudar após uma atualização, é cache">%VERSAO%</span>
  </header>
  <main>
    <div id="editor"></div>
    <aside id="painel">
      <canvas id="arena" width="400" height="400"></canvas>
      <div id="leitura">distância: —</div>
    </aside>
  </main>
  <canvas id="confete"></canvas>

  <script>
  /* Escrito em ES5 de propósito, e antes de tudo: se um navegador velho não
     entender os arquivos abaixo, este handler ainda roda e conta o que houve.
     Sem ele a página fica em "conectando..." para sempre, sem dizer por quê —
     que foi exatamente o que aconteceu num iPad 2. */
  window.onerror = function (msg, arq, lin) {
    var caixa = document.getElementById('erro');
    if (!caixa) return false;
    caixa.textContent = 'Esta página não funcionou neste navegador. ' +
      'Ele pode ser antigo demais. (' + msg + ')';
    var estado = document.getElementById('estado');
    if (estado) estado.textContent = 'não abriu';
    return false;
  };
  </script>
  <script src="vendor/blockly_compressed.js"></script>
  <script src="vendor/pt-br.js"></script>
  <script src="compilador.js"></script>
  <script src="campos.js"></script>
  <script src="som.js"></script>
  <script src="niveis.js"></script>
  <script src="robo.js"></script>
  <script src="blocos.js"></script>
  <script src="rede.js"></script>
  <script src="arena.js"></script>
  <script src="app.js"></script>
</body>
</html>
