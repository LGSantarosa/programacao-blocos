<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robô de Blocos</title>
<link rel="icon" href="img/foguete.png">
<link rel="apple-touch-icon" href="img/foguete.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Paleta da Educação Criativa, medida do logo da própria plataforma:
     azul royal #0050f0, ciano #20b0f0, navy #002080, amarelo #f0c000.
     Azul vivo, não dessaturado — era o que dava ar de tristeza antes.

     Linguagem física: nada aqui é plano. Botão é plástico grosso com sombra
     sólida embaixo, e afunda quando apertado — a gramática que uma criança de
     quatro anos entende sem ninguém explicar.

     Sem var(), gap, aspect-ratio ou inset: precisa abrir num iPad 2 com iOS 9. */

  * { box-sizing: border-box; }

  /* height:100% e não 100vh, e a altura no html junto para o 100% ter contra o
     que medir. Num tablet ou celular, 100vh é a janela SEM a barra de endereço
     — a maior das duas — então a página nasce mais alta que a área visível e o
     rodapé do corpo cai fora da tela. Era o que fazia a missão aparecer no
     carregamento e sumir um segundo depois, quando o navegador se acertava.
     O dvh resolveria isso numa linha e não existe no Safari do iOS 9; o 100%
     resolve em todos. */
  html { height: 100%; }

  body {
    margin: 0; height: 100%; display: flex; flex-direction: column;
    /* Fundo quente, não branco clínico: é o que separa brinquedo de formulário. */
    background: #eaf4fe; color: #002080;
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN",
                 "Varela Round", Nunito, Quicksand, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- cabeçalho ---------- */
  /* Faixa colorida em vez de branca. Branco sobre branco é o que dava cara de
     hospital, e uma barra forte também ancora a tela. */

  /* Dobra em vez de esticar a página. Era nowrap, e com dez itens dentro isso
     dava 904px de conteúdo numa faixa que não quebrava: em qualquer tela mais
     estreita que isso — um iPad em pé tem 768 — o PARAR ficava fora do alcance,
     só chegável arrastando a página para o lado. */
  header {
    display: flex; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; background: #0050f0; color: #fff;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
  }
  header > * { margin-right: 10px; }
  header > *:last-child { margin-right: 0; }

  h1 {
    font-size: 19px; font-weight: 800; margin: 0; color: #fff;
    letter-spacing: -.01em; white-space: nowrap;
    display: flex; align-items: center;
  }
  /* O foguete da Educação Criativa. Fundo branco arredondado atrás dele
     porque a marca é azul e o cabeçalho também — sem isso ele some. */
  h1 .marca {
    height: 30px; width: auto; margin-right: 9px; flex: none;
    background: #fff; border-radius: 9px; padding: 3px 5px;
    box-sizing: content-box;
  }

  .espaco { flex: 1; }

  /* ---------- botões físicos ---------- */

  /* Alvo de toque generoso: dedo de criança de quatro anos erra o que for
     pequeno, e errar o PLAY é a diferença entre brincar e desistir. */
  button {
    font-family: inherit; font-size: 20px; font-weight: 800;
    padding: 14px 26px; border: none; border-radius: 16px;
    color: #fff; cursor: pointer; white-space: nowrap;
    -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
  }
  button:active:not(:disabled) { -webkit-transform: translateY(4px); transform: translateY(4px); }
  button:focus { outline: none; }
  button:focus-visible { outline: 3px solid #f0c000; outline-offset: 2px; }

  #play  { background: #37c26b; box-shadow: 0 5px 0 #2a9c54; }
  #parar { background: #f25c4a; box-shadow: 0 5px 0 #c94435; }
  #mudo  { background: #002080; box-shadow: 0 5px 0 #00185f;
           font-size: 22px; padding: 13px 17px; line-height: 1; }
  #play:active:not(:disabled), #parar:active:not(:disabled),
  #mudo:active:not(:disabled) { box-shadow: 0 1px 0 rgba(0,0,0,.25); }

  /* Com id, senão #play e #parar vencem por especificidade e o botão
     desabilitado só ganha transparência — vermelho lavado sobre o azul do
     cabeçalho vira lilás, que não parece desligado, parece defeito. */
  #play:disabled, #parar:disabled, #mudo:disabled {
    background: #003bb3; color: #7f9fe8;
    box-shadow: 0 5px 0 #002b85; cursor: default; opacity: 1;
  }
  #mudo.silenciado { opacity: .55; }

  /* ---------- seletor de nível ---------- */
  /* Três teclas, não um menu suspenso: criança de quatro anos não abre dropdown. */

  #niveis { display: flex; background: #002080; padding: 4px;
            border-radius: 15px; }
  #niveis button {
    font-size: 16px; font-weight: 800; padding: 10px 16px;
    background: transparent; color: #93b4f5; border-radius: 11px;
    box-shadow: none;
  }
  #niveis button:active:not(:disabled) { -webkit-transform: none; transform: none; }
  #niveis button[aria-pressed="true"] { background: #fff; color: #0050f0; }

  #estado { font-size: 14px; font-weight: 700; color: #b9d3ff; white-space: nowrap; }
  #versao { font-size: 11px; color: #7fa4f0; font-family: monospace; }
  #erro { color: #ffe08a; font-size: 14px; font-weight: 700; max-width: 260px; }

  /* ---------- diálogo de confirmação ---------- */
  /* Sem <dialog>: não existe no Safari do iOS 9. Um div com position:fixed e
     top/right/bottom/left faz o mesmo e abre em tudo. */

  #confirma {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 200;
    background: rgba(0, 32, 128, .55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  /* Obrigatório: o display:flex acima vence o [hidden] do navegador, e sem
     esta linha o diálogo nasce visível e nunca fecha. */
  #confirma[hidden] { display: none; }

  #confirma-caixa {
    background: #fff; border-radius: 22px; padding: 26px 28px;
    max-width: 420px; text-align: center;
    box-shadow: 0 10px 0 rgba(0, 32, 128, .25);
  }
  #confirma-titulo { margin: 0 0 10px; font-size: 24px; font-weight: 800;
                     color: #002080; }
  #confirma-texto { margin: 0 0 22px; font-size: 17px; font-weight: 700;
                    color: #002080; line-height: 1.35; }
  #confirma-botoes { display: flex; justify-content: center; }
  #confirma-botoes button { margin: 0 8px; }

  /* O "Não" é o botão pesado, e nasce com o foco: o que escapar por teclado
     escapa para o lado seguro. */
  /* ---------- painel do código ---------- */

  /* Navy como o 🔊 e o "Não" do diálogo: é botão de adulto curioso, não o
     PLAY. As chaves no rótulo dizem "código" antes de a palavra ser lida. */
  #codigo { background: #002080; box-shadow: 0 5px 0 #00185f;
            font-size: 16px; padding: 12px 16px; }
  #codigo:active:not(:disabled) { box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  #codigo[hidden] { display: none; }

  #painel-codigo {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 200;
    background: rgba(0, 32, 128, .55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  /* Obrigatório, mesmo motivo do #confirma: o display:flex acima vence o
     [hidden] do navegador, e sem esta linha o painel nasce visível. */
  #painel-codigo[hidden] { display: none; }

  #codigo-caixa {
    background: #fff; border-radius: 22px; padding: 22px 24px;
    max-width: 680px; width: 100%; box-sizing: border-box;
    box-shadow: 0 10px 0 rgba(0, 32, 128, .25);
  }
  #codigo-titulo { margin: 0 0 12px; font-size: 20px; font-weight: 800;
                   color: #002080; font-family: monospace; }
  /* A rolagem é do <pre>, não da página: o código é largo e comprido, e a
     página inteira rolando levaria os botões para fora da tela. */
  #codigo-texto {
    margin: 0 0 18px; padding: 14px; background: #f2f5fb;
    border-radius: 12px; max-height: 55vh; overflow: auto;
    font-family: monospace; font-size: 13px; line-height: 1.45;
    color: #002080; text-align: left; white-space: pre;
  }
  #codigo-botoes { display: flex; justify-content: center; }
  #codigo-botoes button { margin: 0 8px; }
  #codigo-baixar { background: #f0c000; color: #002080;
                   box-shadow: 0 5px 0 #c49d00; }
  #codigo-fechar { background: #002080; box-shadow: 0 5px 0 #00185f; }

  #confirma-nao { background: #002080; box-shadow: 0 5px 0 #00185f; }
  #confirma-sim { background: #f0c000; color: #002080;
                  box-shadow: 0 5px 0 #c49c00; }

  /* ---------- corpo ---------- */

  main { flex: 1; display: flex; min-height: 0; padding: 12px; }

  #editor {
    flex: 1; min-width: 0; min-height: 260px; background: #fff;
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 4px 0 #c5dcf3;
    margin-right: 12px;
  }

  #painel {
    width: 300px; flex: none; padding: 12px; background: #fff;
    border-radius: 20px; box-shadow: 0 4px 0 #c5dcf3;
    /* Centrado: o painel é mais alto que o conteúdo, e sobra embaixo parece
       descuido enquanto respiro em volta parece escolha. */
    display: flex; flex-direction: column; justify-content: center;
    align-items: center;
  }
  #painel > * { margin-bottom: 10px; }
  #painel > *:last-child { margin-bottom: 0; }

  /* Sem aspect-ratio (iOS 15+): o canvas é 400x400, então altura fixa dá o
     mesmo quadrado em qualquer navegador. */
  #arena {
    width: 100%; max-width: 276px; height: 276px; border-radius: 16px;
    /* Tapete de brincar, não papel de exame. */
    background: #fdf3dc; border: 3px solid #c5dcf3; display: block;
  }

  /* A missão fica acima da arena: é o que a criança lê antes de montar. */
  #missao {
    width: 100%; background: #0050f0; color: #fff; border-radius: 14px;
    padding: 10px 12px; text-align: center; font-weight: 800; font-size: 16px;
  }
  #missao.cumprida { background: #37c26b; }
  #proxima {
    display: block; width: 100%; margin-top: 8px; font-size: 16px;
    padding: 10px 14px; background: #fff; color: #0050f0; box-shadow: 0 4px 0 #cfe0ee;
  }
  #proxima:active { box-shadow: 0 1px 0 #cfe0ee; }
  /* display:block acima vence a regra padrão do navegador para [hidden], e sem
     isto o botão fica visível o tempo todo — a criança pula a missão sem ter
     cumprido. */
  #proxima[hidden] { display: none; }
  /* Só aparece depois de algumas tentativas: oferecer a resposta cedo demais
     tira da criança a parte que ensina. */
  #gabarito {
    display: block; width: 100%; margin-top: 8px; font-size: 15px;
    padding: 10px 12px; background: #f0c000; color: #4a3a00;
    box-shadow: 0 4px 0 #c79f00;
  }
  #gabarito:active { box-shadow: 0 1px 0 #c79f00; }
  #gabarito[hidden] { display: none; }

  #leitura {
    width: 100%;
    font-size: 16px; font-weight: 800; color: #002080;
    background: #eaf4fe; border-radius: 12px; padding: 10px 12px;
    text-align: center;
  }

  /* ---------- destaque do bloco ---------- */
  /* O halo do Blockly é discreto demais para uma tela de criança, e não expõe
     classe para estilizar. Marcamos o bloco por conta própria. */

  .blocklyDraggable.aceso > .blocklyPath {
    stroke: #f0c000 !important;
    stroke-width: 5px !important;
    -webkit-animation: pulsar .7s ease-in-out infinite;
    animation: pulsar .7s ease-in-out infinite;
  }
  @-webkit-keyframes pulsar { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .3; } }
  @keyframes pulsar { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .3; } }

  /* A fonte dos blocos NÃO se mexe por aqui: o Blockly mede o texto para
     dimensionar o bloco antes de o CSS valer. Vai pelo tema, em app.js. */
  /* Largura mínima: com a fonte grande o rótulo "Movimento" não cabia nos
     128px que o Blockly calculava, e saía cortado. */
  .blocklyToolboxDiv { background: #f4f9ff !important; padding-top: 14px !important;
                       min-width: 158px !important; }
  .blocklyTreeLabel { font-family: inherit !important; font-weight: 800 !important;
                      font-size: 17px !important; }
  /* Linha de categoria alta: é um alvo de toque, não um item de menu.
     O Blockly fixa a altura da linha pela métrica da fonte original, então
     aumentar o texto o fazia transbordar e o rótulo saía cortado pela metade.
     Virar contêiner flex e centrar o rótulo tira a briga com a altura dele. */
  .blocklyTreeRow {
    height: 46px !important; line-height: normal !important;
    display: flex !important; align-items: center !important;
  }
  .blocklyFlyoutBackground { fill: #f4f9ff !important; }

  #confete { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
             pointer-events: none; z-index: 50; }

  @media (prefers-reduced-motion: reduce) {
    .blocklyDraggable.aceso > .blocklyPath { -webkit-animation: none; animation: none; }
  }

  /* Tablet: a caixa de blocos e a paleta do Blockly já comem largura, então o
     painel do robô encolhe para o editor não virar uma faixa estreita. */
  @media (max-width: 1100px) {
    h1 { font-size: 16px; }
    button { font-size: 18px; padding: 13px 20px; }
    #niveis button { font-size: 15px; padding: 10px 13px; }
    #painel { width: 230px; }
    #arena { max-width: 206px; height: 206px; }
    #versao { display: none; }
  }

  /* Tela estreita de verdade: o painel vai para baixo. */
  @media (max-width: 780px) {
    main { flex-direction: column; }
    #editor { margin-right: 0; margin-bottom: 12px; }
    /* Envolve em vez de espremer: num tablet de 7 polegadas em pé a missão
       sobrava com 148px entre a arena e a leitura, ilegível. Com o mínimo
       declarado, a linha quebra sozinha quando não cabe, e a missão desce
       inteira para a faixa de cima. Onde cabe — o iPad em pé, com 744 —
       continua tudo lado a lado. */
    #painel { width: auto; flex-direction: row; align-items: center;
              flex-wrap: wrap; justify-content: center; }
    #painel > * { margin-bottom: 0; margin-right: 10px; }
    /* width:100% na missão, herdado da coluna, a fazia disputar a linha inteira
       com a arena; elástica ela toma só o que sobra. */
    #missao { width: auto; flex: 1 1 240px; min-width: 240px; }
    #arena { max-width: 220px; height: 220px; }
    /* width:auto junto: sem ele a leitura leva os 100% da coluna para
       dentro da linha, toma 720px e empurra missão e arena para fora
       da tela pela esquerda. */
    #leitura { width: auto; flex: none; }
  }

  /* Onde o cabeçalho deixa de caber numa faixa só. O corte é decidido aqui e
     não pelo flex-wrap: o "{ } ver código" aparece e some conforme o nível, e
     deixar o navegador escolher faria a barra saltar de duas linhas para três
     ao trocar de nível. O espaçador vira uma linha inteira de altura zero, e
     tudo que vem depois dele desce junto. */
  @media (max-width: 950px) {
    header { padding-bottom: 3px; }
    header > * { margin-bottom: 7px; }
    /* flex-basis junto, e não só width: a regra base dá flex:1 ao espaçador,
       o que fixa a base em zero — o width:100% sozinho não empurra nada e a
       barra quebra onde o navegador quiser, deixando o PARAR órfão numa
       linha longe do PLAY. */
    .espaco { flex: 0 0 100%; width: 100%; height: 0; margin: 0; }
  }

  /* Celular. O lugar de verdade é o tablet; aqui a meta é só não estar
     quebrado — nada fora da tela, nada espremido, todo alvo de toque grande.
     A página passa a rolar, e é isso que deixa cada peça manter tamanho
     decente em vez de todas caberem apertadas. */
  @media (max-width: 560px) {
    body { height: auto; min-height: 100%; }
    main { display: block; padding: 10px; }

    h1 { font-size: 15px; }
    h1 .marca { height: 26px; }
    #erro { max-width: none; }
    #niveis { width: 100%; }
    #niveis button { flex: 1; font-size: 14px; padding: 10px 4px; }
    #codigo { width: 100%; }
    #play, #parar { flex: 1; font-size: 17px; padding: 13px 10px; }
    #estado { width: 100%; text-align: center; }

    #editor { height: 58vh; min-height: 300px; margin-right: 0; margin-bottom: 12px; }

    /* Desfaz a linha da quebra de 780: em 360px ela espremia a missão a 80px
       de largura, uma palavra por linha, e ainda começando fora da tela. */
    #painel { width: auto; flex-direction: column; align-items: stretch; }
    #painel > * { margin-right: 0; margin-bottom: 10px; }
    #painel > *:last-child { margin-bottom: 0; }
    #missao { width: 100%; flex: none; }
    #arena { width: 260px; max-width: 100%; height: 260px;
             margin-left: auto; margin-right: auto; }
    #leitura { flex: none; }

    /* A caixa de categorias afina para sobrar gaveta. Sozinho não resolve: a
       largura do bloco vem da fonte que o Blockly mede, e essa mora no tema,
       no app.js. */
    .blocklyToolboxDiv { min-width: 104px !important; padding-top: 8px !important; }
    .blocklyTreeLabel { font-size: 15px !important; }
    .blocklyTreeRow { height: 40px !important; }
  }
</style>
</head>
<body>
  <header>
    <h1><img class="marca" src="img/foguete.png" alt="Educação Criativa">Robô de Blocos</h1>
    <span id="erro"></span>
    <span class="espaco"></span>
    <div id="niveis" role="group" aria-label="nível">
      <button type="button" data-nivel="pequeno" aria-pressed="false">Pequeno</button>
      <button type="button" data-nivel="medio"   aria-pressed="true">Médio</button>
      <button type="button" data-nivel="grande"  aria-pressed="false">Grande</button>
      <button type="button" data-nivel="gigante" aria-pressed="false">Gigante</button>
    </div>
    <button id="codigo" type="button" hidden>{ } ver código</button>
    <button id="mudo" title="ligar e desligar o som">🔊</button>
    <button id="play">▶ PLAY</button>
    <button id="parar" disabled>■ PARAR</button>
    <span id="estado">conectando…</span>
    <span id="versao" title="versão servida — se não mudar após uma atualização, é cache">%VERSAO%</span>
  </header>
  <main>
    <div id="editor"></div>
    <aside id="painel">
      <div id="missao">
        <span id="missao-texto">…</span>
        <button id="proxima" type="button" hidden>próxima ▸</button>
        <button id="gabarito" type="button" hidden>me mostra como faz</button>
      </div>
      <canvas id="arena" width="400" height="400"></canvas>
      <div id="leitura">distância: —</div>
    </aside>
  </main>
  <canvas id="confete"></canvas>

  <div id="confirma" hidden>
    <div id="confirma-caixa" role="dialog" aria-modal="true"
         aria-labelledby="confirma-titulo">
      <h2 id="confirma-titulo">Trocar de nível?</h2>
      <p id="confirma-texto">Os blocos que você montou vão ser apagados.</p>
      <div id="confirma-botoes">
        <button id="confirma-nao" type="button">Não</button>
        <button id="confirma-sim" type="button">Trocar</button>
      </div>
    </div>
  </div>

  <div id="painel-codigo" hidden>
    <div id="codigo-caixa" role="dialog" aria-modal="true"
         aria-labelledby="codigo-titulo">
      <h2 id="codigo-titulo">robo.ino</h2>
      <pre id="codigo-texto"></pre>
      <div id="codigo-botoes">
        <button id="codigo-baixar" type="button">baixar</button>
        <button id="codigo-fechar" type="button">fechar</button>
      </div>
    </div>
  </div>

  <script>
  /* Escrito em ES5 de propósito, e antes de tudo: se um navegador velho não
     entender os arquivos abaixo, este handler ainda roda e conta o que houve.
     Sem ele a página fica em "conectando..." para sempre, sem dizer por quê —
     que foi exatamente o que aconteceu num iPad 2. */
  window.onerror = function (msg, arq, lin) {
    var caixa = document.getElementById('erro');
    if (!caixa) return false;
    caixa.textContent = 'Esta página não funcionou neste navegador. ' +
      'Ele pode ser antigo demais. (' + msg + ')';
    var estado = document.getElementById('estado');
    if (estado) estado.textContent = 'não abriu';
    return false;
  };
  </script>
  <script src="vendor/blockly_compressed.js"></script>
  <script src="vendor/pt-br.js"></script>
  <script src="compilador.js"></script>
  <script src="arduino.js"></script>
  <script src="campos.js"></script>
  <script src="som.js"></script>
  <script src="niveis.js"></script>
  <script src="robo.js"></script>
  <script src="blocos.js"></script>
  <script src="missoes.js"></script>
  <script src="gabarito.js"></script>
  <script src="rede.js"></script>
  <script src="arena.js"></script>
  <script src="app.js"></script>
</body>
</html>
