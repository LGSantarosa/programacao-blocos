<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico</title>
<style>
  /* Só CSS que o Safari do iOS 9 entende: nada de gap, aspect-ratio ou var(). */
  body { margin: 0; padding: 10px; font-family: Helvetica, Arial, sans-serif;
         background: #eef5fb; color: #1b3a57; font-size: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px 0; }
  #log { background: #fff; border: 2px solid #cfe0ee; border-radius: 10px;
         padding: 8px; margin-bottom: 10px; }
  .linha { padding: 4px 0; border-bottom: 1px solid #eef5fb; }
  .ok { color: #1f7a44; font-weight: bold; }
  .nao { color: #c0392b; font-weight: bold; }
  #erro { background: #ffe9e6; border: 2px solid #f25c4a; border-radius: 10px;
          padding: 8px; margin-bottom: 10px; display: none;
          white-space: pre-wrap; word-wrap: break-word; font-size: 13px; }
  #editor { height: 320px; border: 2px solid #cfe0ee; border-radius: 10px;
            background: #fff; }
</style>
</head>
<body>
<h1>Diagnóstico — monta o app de verdade</h1>
<p style="margin:0 0 8px 0;font-family:monospace">versão servida: <b>%VERSAO%</b></p>
<div id="erro"></div>
<div id="log"></div>
<div id="editor"></div>

<script>
var caixaErro = document.getElementById('erro');
window.onerror = function (msg, arq, lin, col) {
  caixaErro.style.display = 'block';
  caixaErro.appendChild(document.createTextNode(
    'ERRO: ' + msg + '\n' + (arq || '') + ' linha ' + lin + ':' + col + '\n\n'));
  return false;
};
var log = document.getElementById('log');
function diz(rotulo, valor) {
  var d = document.createElement('div');
  d.className = 'linha';
  d.appendChild(document.createTextNode(rotulo + ': '));
  var m = document.createElement('span');
  var bom = valor !== 0 && valor !== false && valor !== 'NÃO';
  m.className = bom ? 'ok' : 'nao';
  m.appendChild(document.createTextNode(String(valor)));
  d.appendChild(m);
  log.appendChild(d);
}
</script>

<!-- os arquivos de verdade, na mesma ordem da página real -->
<script src="vendor/blockly_compressed.js"></script>
<script src="vendor/pt-br.js"></script>
<script src="compilador.js"></script>
<script src="campos.js"></script>
<script src="som.js"></script>
<script src="niveis.js"></script>
<script src="robo.js"></script>
<script src="blocos.js"></script>
<script src="rede.js"></script>
<script src="arena.js"></script>

<script>
diz('Blockly', typeof Blockly);
diz('nossos módulos', (typeof Blocos) + '/' + (typeof Niveis) + '/' + (typeof Campos));

var ws = null;
try {
  Campos.registrar();
  Blocos.definir();
  diz('blocos definidos', Blockly.Blocks['mover_frente'] ? 'SIM' : 'NÃO');

  var nivel = Niveis.atual();
  diz('nível guardado', nivel);

  var xml = Niveis.caixaXml(nivel);
  diz('tamanho do XML da caixa', xml.length);
  diz('categorias no XML', (xml.match(/<category/g) || []).length);

  /* O tema: se defineTheme se comportar diferente nesta versão, é aqui. */
  var tema = null;
  try {
    tema = Blockly.Theme.defineTheme('diag', {
      base: Blockly.Themes.Classic,
      fontStyle: { family: 'system-ui, sans-serif', weight: 'bold', size: 11 }
    });
    diz('tema criado', 'SIM');
  } catch (e) {
    diz('tema criado', 'NÃO — ' + e.message);
  }

  var opcoes = { toolbox: xml, trashcan: true };
  if (tema) opcoes.theme = tema;
  ws = Blockly.inject('editor', opcoes);
  diz('workspace', ws ? 'SIM' : 'NÃO');

  if (Blockly.svgResize) Blockly.svgResize(ws);

  var svg = document.querySelector('#editor svg');
  diz('largura do SVG', svg ? Math.round(svg.getBoundingClientRect().width) : 'sem svg');
  diz('altura do SVG', svg ? Math.round(svg.getBoundingClientRect().height) : 'sem svg');

  diz('categorias desenhadas', document.querySelectorAll('.blocklyTreeRow').length);
  diz('div da caixa existe', document.querySelectorAll('.blocklyToolboxDiv').length);

  var tb = ws.getToolbox ? ws.getToolbox() : null;
  diz('objeto toolbox', tb ? 'SIM' : 'NÃO');

  if (tb && tb.getToolboxItems) {
    var itens = tb.getToolboxItems();
    diz('itens no toolbox', itens.length);
    try {
      tb.setSelectedItem(itens[0]);
      diz('abriu a categoria', 'SIM');
    } catch (e) { diz('abriu a categoria', 'NÃO — ' + e.message); }
  }

  setTimeout(function () {
    var f = ws.getFlyout ? ws.getFlyout() : null;
    diz('flyout existe', f ? 'SIM' : 'NÃO');
    if (f) {
      diz('blocos na paleta', f.getWorkspace().getAllBlocks(false).length);
      var fs = document.querySelectorAll('.blocklyFlyout');
      diz('largura do flyout', fs.length ?
        Math.round(fs[0].getBoundingClientRect().width) : 'sem elemento');
    }
    diz('blocos desenhados na tela', document.querySelectorAll('#editor .blocklyDraggable').length);
    var p = document.createElement('p');
    p.appendChild(document.createTextNode('Toque numa categoria acima e veja se aparecem blocos.'));
    log.appendChild(p);
  }, 800);
} catch (e) {
  diz('montagem', 'NÃO — ' + e.message);
}
</script>
</body>
</html>
